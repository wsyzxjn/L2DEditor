[workspace]
resolver = "2"
members = [
    "crates/l2d-core",
    "crates/l2d-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["L2DEditor Contributors"]
repository = "https://github.com/L2DEditor/L2DEditor"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
wasm-bindgen = "=0.2.100"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = "0.3"
